[project]
name = "paladin-sim"
version = "0.1.0"
description = "PALADIN-Station simulation engine: physics, routing, agents, and the ATHENA verification gate."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "networkx>=3.7",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
]
